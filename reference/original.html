<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OneChat Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout follows the OneChat staging console: channel sidebar, conversation list, chat, plus a customer panel for the Flow. */
  :root {
    color-scheme: dark;
    --bg: #0f1117;
    --side: #111626;
    --panel: #151b2b;
    --surface: #1a2133;
    --raise: #232b40;
    --line: #2a3349;
    --fg: #e6e9f2;
    --fg2: #b4bbcd;
    --muted: #8a92a8;
    --brand: #3d86ee;
    --btn: #0a66d6;
    --ok: #3cc58a;
    --danger: #ee6c6c;
    --font: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; }
  * { box-sizing: border-box; }
  button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  ::placeholder { color: var(--muted); }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .login { height: 100%; display: grid; place-items: center; padding: 16px; }
  .login-card { width: min(100%, 360px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
  .login-card h1 { margin: 0; text-align: center; font-size: 26px; color: var(--brand); font-weight: 700; }
  .login-card .sub { margin: -8px 0 4px; text-align: center; color: var(--muted); font-size: 13px; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--fg2); }
  .btn { background: var(--btn); color: #fff; border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 600; }
  .btn:hover { filter: brightness(1.12); }
  .btn.sm { padding: 6px 12px; font-size: 13px; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); }
  .btn.ok { background: #1f9d68; }
  .btn.danger { background: #c4393d; }
  .btn:disabled { background: var(--raise); color: var(--muted); cursor: not-allowed; filter: none; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin: 0; }

  #app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
  .viewtabs { display: none; flex: none; background: var(--panel); border-bottom: 1px solid var(--line); }
  .viewtabs button { flex: 1; background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 10px 2px; color: var(--muted); font-weight: 600; font-size: 13px; }
  .viewtabs button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
  .shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 224px minmax(0, 1fr); }

  /* sidebar: channels (Merchant) */
  .side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 16px 16px 14px; font-weight: 700; font-size: 18px; color: var(--brand); border-bottom: 1px solid var(--line); }
  .selbar { padding: 12px 16px 6px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .selbar button { background: none; border: 0; color: var(--brand); padding: 0; }
  .selbar i { width: 1px; height: 12px; background: var(--line); }
  .chs { flex: 1; overflow: auto; padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 2px; }
  .ch { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 8px; }
  .ch:hover { background: var(--surface); }
  .ch label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; cursor: pointer; }
  .ch label span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch label small { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .ch input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--btn); padding: 0; flex: none; }
  .ch .gear { background: none; border: 0; color: var(--muted); padding: 2px; display: grid; place-items: center; border-radius: 6px; }
  .ch .gear:hover { color: var(--fg); background: var(--raise); }
  .me { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; gap: 8px; color: var(--fg2); font-size: 13px; }
  .me .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me button { background: none; border: 0; color: var(--muted); padding: 4px; display: grid; place-items: center; }

  .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 52px; background: var(--side); border-bottom: 1px solid var(--line); position: relative; }
  .top h1 { margin: 0; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .dotg { width: 8px; height: 8px; border-radius: 99px; background: var(--ok); }
  .top .grow { flex: 1; }
  .gs { flex: none; display: flex; flex-direction: column; gap: 6px; }
  .gs input { width: 100%; }
  .gsres { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; max-height: 260px; overflow: auto; }
  .gsres button { display: block; width: 100%; text-align: left; padding: 8px 12px; background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--fg); font: inherit; font-size: 13px; cursor: pointer; }
  .gsres button:hover, .gsres button:focus-visible { background: var(--surface); }
  .gsres small { display: block; color: var(--fg2); }
  .gsres .none { padding: 10px 12px; font-size: 13px; color: var(--muted); }
  .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .meta b { color: var(--ok); font-family: var(--mono); font-weight: 500; }
  .burger { width: 40px; height: 34px; display: grid; place-items: center; background: transparent; border: 1px solid var(--line); border-radius: 8px; }
  .menu { position: absolute; right: 12px; top: calc(100% + 4px); z-index: 20; width: min(300px, calc(100% - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 12px 32px rgba(0, 0, 0, .5); max-height: 75vh; overflow: auto; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
  .menu button { width: 100%; text-align: left; background: transparent; border: 0; border-radius: 6px; padding: 9px 10px; display: flex; align-items: center; gap: 10px; }
  .menu button:hover { background: var(--raise); }
  .menu .dot { width: 8px; height: 8px; border-radius: 99px; flex: none; }

  .console { flex: 1; min-height: 0; display: grid; grid-template-columns: 310px minmax(0, 1fr) 360px; }
  .col { min-height: 0; overflow: auto; display: flex; flex-direction: column; }
  #colList { border-right: 1px solid var(--line); background: var(--panel); }
  #colPanel { border-left: 1px solid var(--line); background: var(--panel); }

  /* conversation list */
  .lh { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 8px; }
  .lh b { font-size: 15px; }
  .lh button { background: none; border: 0; color: var(--muted); padding: 4px; display: grid; place-items: center; border-radius: 6px; }
  .tabs { flex: none; display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 9px 4px; font-weight: 600; color: var(--muted); display: flex; gap: 6px; justify-content: center; align-items: center; }
  .tabs button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
  .tabs .count { background: var(--raise); color: var(--fg2); border-radius: 99px; padding: 0 7px; font-size: 12px; font-family: var(--mono); }
  .cases { padding: 0; display: flex; flex-direction: column; flex: 1; }
  .case { width: 100%; text-align: left; background: var(--cbg); border: 0; border-bottom: 1px solid var(--line); border-left: 4px solid var(--cb); color: var(--fg); padding: 11px 12px; display: flex; gap: 10px; }
  .case[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--brand); }
  .av { width: 38px; height: 38px; border-radius: 99px; background: var(--raise); display: grid; place-items: center; font-weight: 600; color: var(--fg2); flex: none; }
  .cb { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .r1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .r1 b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r1 .ago { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .r2 { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; }
  .chip { background: rgba(255, 255, 255, .09); border-radius: 6px; padding: 0 7px; color: var(--fg2); }
  .chip.adm { color: var(--fg); }
  .r3 { font-size: 13px; color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st-yellow { --cb: #f6d55c; --cbg: #3a3318; }
  .st-orange { --cb: #f4a259; --cbg: #3d2a17; }
  .st-red { --cb: #ee6c6c; --cbg: #40202a; }
  .st-white { --cb: #e6eaf3; --cbg: #1f2538; }
  .empty { color: var(--muted); text-align: center; padding: 28px 12px; }
  .legend { margin-top: auto; padding: 10px 12px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; background: var(--cb); vertical-align: -1px; }

  /* chat */
  #colChat { background: var(--bg); }
  .chead { flex: none; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .chead .l1 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chead .oa { font-size: 12px; color: var(--ok); }
  .chead .oa b { font-weight: 600; }
  .chead .edit { display: flex; gap: 6px; flex-wrap: wrap; }
  .chead .edit input { flex: 1; min-width: 90px; padding: 6px 9px; }
  .status { font-size: 12px; padding: 1px 10px; border-radius: 99px; background: var(--cbg); color: var(--cb); border: 1px solid var(--cb); font-weight: 600; }
  .note { flex: none; display: flex; align-items: center; border-bottom: 1px solid var(--line); background: var(--panel); }
  .note span { padding: 7px 12px; font-weight: 700; color: var(--fg2); border-right: 1px solid var(--line); }
  .note input { flex: 1; border: 0; border-radius: 0; background: transparent; }
  .msgs { flex: 1; min-height: 160px; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 82%; display: flex; flex-direction: column; gap: 2px; }
  .m .who { font-size: 11px; color: var(--muted); }
  .m .bub { padding: 8px 12px; border-radius: 12px; background: var(--raise); white-space: pre-wrap; overflow-wrap: anywhere; }
  .m.cust { align-self: flex-start; }
  .m.sys, .m.admin { align-self: flex-end; align-items: flex-end; }
  .m.sys .bub { background: #17324f; border: 1px solid #23507f; }
  .m.admin .bub { background: #1b4a3a; border: 1px solid #25705a; }
  .closed-bar { align-self: stretch; text-align: center; background: #4a2327; color: #ffd5d7; border-radius: 8px; padding: 7px; font-weight: 600; }
  .composer { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .quick button { background: var(--raise); border: 1px solid var(--line); border-radius: 99px; padding: 3px 11px; font-size: 12px; }
  .quick button:hover { border-color: var(--brand); }
  .send { display: flex; gap: 8px; }
  .send input { flex: 1; }
  .noconv { margin: auto; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; }

  /* right panel */
  .blk { flex: none; margin: 10px 12px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  #colPanel .blk:last-child { margin-bottom: 14px; }
  .blk h3 { margin: 0; padding: 9px 12px; font-size: 14px; font-weight: 600; background: var(--raise); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .blk h3 small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .blk .body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .kv { display: grid; grid-template-columns: 88px minmax(0, 1fr); font-size: 13px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 0; }
  .kv dt, .kv dd { margin: 0; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .kv dt { background: var(--raise); color: var(--fg2); font-weight: 600; }
  .kv dd { overflow-wrap: anywhere; }
  .kv dt:last-of-type, .kv dd:last-of-type { border-bottom: 0; }
  .tag { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .tag.ok { background: #16402f; color: #7fe3b4; }
  .tag.bad { background: #4a2327; color: #ffb4b7; }
  .tag.dep { background: #17335a; color: #9cc7ff; }
  .stmt { display: flex; flex-direction: column; gap: 6px; }
  .stmt label { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .stmt label input { padding: 0; }
  .stmt label span.t { color: var(--muted); font-size: 12px; margin-left: auto; }
  .ai { display: flex; gap: 10px; align-items: center; color: var(--fg2); font-size: 13px; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 99px; animation: sp .9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .msg-ok { color: var(--ok); font-size: 13px; }
  .msg-bad { color: var(--danger); font-size: 13px; }

  .btn.warn { background: #f0a030; color: #1d1400; }
  .tag.warn { background: #4a3a12; color: #ffd77a; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; background: transparent; border: 0; padding: 7px 6px; font-weight: 600; color: var(--muted); }
  .seg button[aria-selected="true"] { background: var(--raise); color: var(--fg); }
  .hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .hist li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 13px; }
  .hist .t { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: grid; place-items: center; padding: 16px; z-index: 40; }
  .accl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .accl li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .accl li > div { flex: 1; min-width: 0; font-size: 13px; }
  .accl .bn { color: var(--fg2); font-size: 12px; }
  .accl .tags { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .dlg { width: min(100%, 520px); max-height: 85vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 48px rgba(0, 0, 0, .6); }
  .dlg header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
  .dlg .dbody { padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .crline { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; }
  .rad { display: flex; gap: 20px; border: 0; padding: 0; margin: 0; flex-wrap: wrap; align-items: center; }
  .rad legend { float: left; margin-right: 14px; padding: 0; font-size: 13px; color: var(--fg2); }
  .rad label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .rad input { padding: 0; accent-color: var(--btn); width: 16px; height: 16px; }
  .party { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .coacc { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); cursor: pointer; font: inherit; }
  .coacc:hover, .coacc:focus-visible { border-color: var(--fg2); }
  .coacc.on { border-color: #22a06b; box-shadow: 0 0 0 1px #22a06b; }
  .coform { display: flex; flex-direction: column; gap: 8px; }
  .coacc > span:not(.bk) { display: flex; flex-direction: column; font-size: 13px; }
  .coacc .bn { font-size: 12px; color: var(--fg2); }
  .party.col { flex-direction: column; align-items: stretch; gap: 8px; }
  .party .prow { display: flex; align-items: center; gap: 12px; }
  .party .role { width: 44px; flex: none; font-size: 12px; color: var(--muted); }
  .party b { font-weight: 600; font-size: 13px; }
  .party .bn { font-size: 12px; color: var(--fg2); }
  .bk { width: 40px; height: 40px; flex: none; border-radius: 10px; display: grid; place-items: center; font-size: 10px; font-weight: 700; letter-spacing: .02em; }
  .pwbox { display: flex; flex-direction: column; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .psec { display: flex; flex-direction: column; gap: 6px; }
  .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .pend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .pend li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 13px; }
  .pend .st { color: var(--fg2); }
  .pend .t { color: var(--muted); font-size: 12px; }
  .slipimg { width: 150px; background: #f4f6fa; color: #1a1d22; border-radius: 8px; padding: 8px 10px; font-size: 11px; display: flex; flex-direction: column; gap: 4px; }
  .slipimg b { font-size: 12px; }
  .slipimg i { display: block; height: 4px; background: #cfd6e4; border-radius: 2px; }
  .slipimg .amt { font-family: var(--mono); font-size: 15px; font-weight: 600; }
  .big { font-family: var(--mono); font-size: 26px; font-weight: 600; }
  .verdict { padding: 8px 10px; border-radius: 8px; font-weight: 600; font-size: 13px; }
  .v-ok { background: #16402f; color: #7fe3b4; }
  .v-bad { background: #4a2327; color: #ffb4b7; }
  .chk { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .chk li { display: flex; gap: 8px; font-size: 13px; }
  .chk li > span { flex: none; width: 16px; font-weight: 700; }
  .chk .d { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .mini { overflow-x: auto; }
  .mini table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .mini th, .mini td { padding: 6px 8px; border: 1px solid var(--line); text-align: left; vertical-align: middle; }
  .mini th { background: var(--raise); color: var(--fg2); font-weight: 600; }

  /* announce page */
  .page { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 14px; }
  .page h2 { margin: 0; font-size: 22px; }
  .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .tbl table { border-collapse: collapse; width: 100%; min-width: 860px; }
  .tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .tbl th { color: var(--muted); font-size: 12px; font-weight: 600; background: var(--raise); }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl textarea { width: 100%; min-height: 64px; resize: vertical; }
  .tbl input[type="number"] { width: 70px; }
  .tbl .acts { display: flex; flex-direction: column; gap: 6px; }
  .tbl tr.add td { background: #131b2e; }
  .tbl tr.dim td { opacity: .6; }
  .back { align-self: flex-start; }

      var rg = st.reg, rno = rg.no.trim(), miss = [];
      if (!rg.name.trim()) miss.push('ชื่อ');
      if (!rg.phone.trim()) miss.push('เบอร์');
      if (!rg.bank) miss.push('ธนาคาร');
      if (!rno) miss.push('เลขที่บัญชี');
      if (!rg.pass) miss.push('รหัสผ่าน');
      if (miss.length) st.regMsg = { ok: false, text: 'กรอกให้ครบ: ' + miss.join(', ') };
      else if (rg.pass.length < 6) st.regMsg = { ok: false, text: 'รหัสผ่านต้องยาว 6 ตัวขึ้นไป' };
      else if (cases.some(function (x) { return x.user.number === rno && x.user.bankCode === rg.bank; })) st.regMsg = { ok: false, text: 'เลขบัญชีซ้ำ สมัครสมาชิกไม่ได้' };
      else {
        var rname = rg.name.trim();
        st.regMsg = { ok: true, text: 'สมัครสมาชิกให้ ' + rname + ' สำเร็จ' };
        st.reg = { name: '', phone: '', bank: '', no: '', pass: '', ref: '' };
        push(c, 'sys', 'สมัครสมาชิก Player ให้ ' + rname + ' เรียบร้อย');
        toast('สมัครสมาชิกแล้ว');
      }
      renderPanel();
    }
    if (act === 'regclear') { st.reg = { name: '', phone: '', bank: '', no: '', pass: '', ref: '' }; st.regMsg = null; renderPanel(); }
  });
  document.addEventListener('change', function (e) {
    var tg = e.target; if (!tg.getAttribute) return;
    if (tg.id === 'regGame') { st.reg.game = tg.value; return; }
    if (tg.id === 'regBank') { st.reg.bank = tg.value; return; }
    if (tg.name === 'crType') { st.credit.type = tg.value; return; }
    var mc = tg.getAttribute('data-mchk');
    if (mc) { var i = st.sel.indexOf(mc); if (tg.checked && i < 0) st.sel.push(mc); if (!tg.checked && i >= 0) st.sel.splice(i, 1); renderList(); return; }
  });
  function gsRender() {
    var box = $('#gsRes'), q = $('#gSearch').value.trim().toLowerCase();
    if (!q) { box.hidden = true; return; }
    var r = cases.filter(function (c) { return [c.name, c.user.username, c.user.fullname, c.user.mobile].join(' ').toLowerCase().indexOf(q) >= 0; }).slice(0, 8);
    box.innerHTML = r.length ? r.map(function (c) { return '<button type="button" data-pick="' + c.id + '"><b>' + esc(c.name) + '</b> · ' + esc(c.user.username) + '<small>' + esc(c.user.fullname) + ' · ' + esc(c.user.mobile) + ' · ' + esc(merch(c.merchant).name) + '</small></button>'; }).join('') : '<div class="none">ไม่พบลูกค้า</div>';
    box.hidden = false;
  }
  document.addEventListener('click', function (e) {
    var p = e.target.closest && e.target.closest('[data-pick]');
    if (p) {
      var pc = cases.filter(function (x) { return x.id === p.getAttribute('data-pick'); })[0];
      if (pc) {
        if (st.sel.length && st.sel.indexOf(pc.merchant) < 0) st.sel = [];
        st.tab = 'all'; st.cur = pc.id; st.regMsg = null; st.lookup = null;
        showPage('console'); $('#gsRes').hidden = true; $('#gSearch').value = '';
        renderSide(); renderList(); renderChat(); renderPanel(); scrollMsgs(); if (isNarrow()) setView('chat');
      }
      return;
    }
    if (!(e.target.closest && e.target.closest('.gs'))) $('#gsRes').hidden = true;
  });
  document.addEventListener('input', function (e) {
    var id = e.target && e.target.id;
    if (id === 'gSearch') gsRender();
    if (id === 'regName') st.reg.name = e.target.value;
    if (id === 'regNo') st.reg.no = e.target.value;
    if (id === 'regPhone') st.reg.phone = e.target.value;
    if (id === 'regRef') st.reg.ref = e.target.value;
    if (id === 'regPass') st.reg.pass = e.target.value;
    if (id === 'crAmt') st.credit.amt = e.target.value;
    if (id === 'crNote') st.credit.note = e.target.value;
    if (id === 'crPass') st.credit.pass = e.target.value;
    if (id === 'pwConf') st.pw.b = e.target.value;
    if (id === 'pwNew') st.pw.a = e.target.value;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && (st.histModal || st.accModal)) { st.accModal = false; st.histModal = false; renderHistModal(); return; }
    if (e.key === 'Escape' && st.menu) setMenu(false);
    if (e.key === 'F4' && st.page === 'console' && !$('#app').hidden) { e.preventDefault(); closeCase(cur()); }
    if (e.key === 'Enter' && e.target && e.target.id === 'msgIn') { e.preventDefault(); var b = document.querySelector('[data-act="send"]'); if (b) b.click(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'noteIn') { e.preventDefault(); if (e.target.value.trim()) { toast('บันทึก Note แล้ว'); e.target.value = ''; } }
  });
  $('#burger').addEventListener('click', function () { setMenu(!st.menu); });
  $('#loginForm').addEventListener('submit', function (e) { e.preventDefault(); $('#login').hidden = true; $('#app').hidden = false; renderAll(); });

  setInterval(function () {
    cases.forEach(function (c) { if (c.status === 'waiting') { c.secs++; var el = document.querySelector('[data-secs="' + c.id + '"]'); if (el) el.textContent = '(' + c.secs + ')'; } });
  }, 1000);

  function renderAll() { renderMenu(); renderSide(); renderList(); renderChat(); renderPanel(); setView(isNarrow() ? 'list' : st.view); scrollMsgs(); }
})();
</script>

</body></html>
