<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>คู่มือการใช้งาน SmartCHAT</title>
<meta name="description" content="คู่มือการใช้งาน SmartCHAT — ตั้งค่า Channel เชื่อมต่อ Telegram และวิธีแก้ปัญหาที่พบบ่อย" />
<script>
  // ตั้งธีมก่อนวาดหน้า ไม่ให้กะพริบ (จำค่าในเบราว์เซอร์นี้ · ครั้งแรกตามเครื่อง)
  try {
    const t = localStorage.getItem("onechat-manual-theme");
    document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  } catch { document.documentElement.dataset.theme = "light"; }
</script>
<style>
  /* ฟอนต์ LINE Seed Sans TH (ไฟล์เดียวกับระบบ SmartCHAT) */
  @font-face { font-family: "LINE Seed Sans TH"; src: url("fonts/LINESeedSansTH_W_Rg.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "LINE Seed Sans TH"; src: url("fonts/LINESeedSansTH_W_Bd.woff2") format("woff2"); font-weight: 700; font-display: swap; }

  /* ธีม: shadcn-theme-kit ของ SmartLiff (Vega · zinc · สีหลัก indigo) — ค่าจาก theme.css ของชุดธีม
     ตัวอักษร 4.5:1 · ขอบ/ไอคอน 3:1 ทั้งสองโหมด · ความสว่างแยกด้วย data-theme="dark" เหมือนในชุดธีม */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.141 0.005 285.823);
    --card: oklch(1 0 0);
    --muted: oklch(0.967 0.001 286.375);
    --muted-foreground: oklch(0.52 0.016 285.938);
    --border: oklch(0.92 0.004 286.32);
    --surface-page: oklch(0.985 0 0);          /* = --sidebar ของชุดธีม: พื้นหน้า */
    --brand: oklch(0.457 0.24 277.023);
    --brand-foreground: oklch(0.985 0 0);
    --ring: var(--brand);
    --warning: oklch(0.5 0.13 52);
    --destructive: oklch(0.48 0.2 27.325);
    --success: oklch(0.465 0.15 152);
    --brand-soft: color-mix(in oklab, var(--brand) 10%, var(--card));
    --tip-bg: color-mix(in oklab, var(--warning) 8%, var(--card));
    --tip-border: color-mix(in oklab, var(--warning) 35%, var(--card));
    --tip-fg: var(--warning);
    --warn-bg: color-mix(in oklab, var(--destructive) 8%, var(--card));
    --warn-border: color-mix(in oklab, var(--destructive) 35%, var(--card));
    --warn-fg: var(--destructive);
    --shadow: 0 1px 2px oklch(0 0 0 / 0.05);
    --radius: 0.625rem;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --background: oklch(0.141 0.005 285.823);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.21 0.006 285.885);
    --muted: oklch(0.274 0.006 286.033);
    --muted-foreground: oklch(0.705 0.015 286.067);
    --border: oklch(1 0 0 / 10%);
    --surface-page: var(--background);
    --brand: oklch(0.72 0.15 277);
    --brand-foreground: oklch(0.141 0.005 285.823);
    --warning: oklch(0.78 0.14 70);
    --destructive: oklch(0.8 0.14 22.216);
    --success: oklch(0.76 0.15 152);
    --brand-soft: color-mix(in oklab, var(--brand) 16%, var(--card));
    --tip-bg: color-mix(in oklab, var(--warning) 12%, var(--card));
    --tip-border: color-mix(in oklab, var(--warning) 35%, var(--card));
    --warn-bg: color-mix(in oklab, var(--destructive) 12%, var(--card));
    --warn-border: color-mix(in oklab, var(--destructive) 35%, var(--card));
    --shadow: none;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: 6rem; }
  body {
    margin: 0;
    background: var(--surface-page);
    color: var(--foreground);
    font-family: "LINE Seed Sans TH", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; height: auto; display: block; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: 1rem; top: -3rem; background: var(--foreground); color: var(--background); padding: .5rem .75rem; border-radius: 8px; z-index: 50; }
  .skip:focus { top: .75rem; }

  /* ── แถบบน ── */
  .top { position: sticky; top: 0; z-index: 20; background: color-mix(in oklab, var(--card) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .top-in { max-width: 96rem; margin: 0 auto; height: 4.5rem; padding: 0 1.5rem; display: flex; align-items: center; gap: 1rem; }
  .logo { display: inline-flex; align-items: center; gap: .55rem; color: var(--brand); }
  .logo img { display: block; height: 1.9rem; width: auto; }
  .logo .dk, [data-theme="dark"] .logo .lt { display: none; }
  [data-theme="dark"] .logo .dk { display: block; }
  .logo small { display: block; margin: .1rem 0 0 2.35rem; font-size: .7rem; letter-spacing: .12em; color: var(--muted-foreground); }
  .crumb { padding-left: 1rem; border-left: 1px solid var(--border); font-weight: 700; font-size: 1rem; line-height: 2rem; }
  .spacer { flex: 1; }
  .logo, .crumb { white-space: nowrap; }
  .theme { display: inline-flex; padding: 3px; gap: 2px; background: var(--muted); border-radius: 999px; }
  .theme button { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; border: 0; border-radius: 999px; background: transparent; color: var(--muted-foreground); cursor: pointer; }
  .theme button[aria-pressed="true"] { background: var(--card); color: var(--foreground); box-shadow: var(--shadow); }
  .theme svg { width: 1rem; height: 1rem; }

  /* ── หน้ารวม ── */
  .wrap { max-width: 96rem; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  .hero h1 { font-size: clamp(1.75rem, 1.2rem + 1.6vw, 2.25rem); line-height: 1.3; margin: 0 0 .35rem; }
  .hero p { margin: 0; color: var(--muted-foreground); max-width: 65ch; }
  .sec { margin-top: 2.5rem; }
  .sec h2 { font-size: 1.4rem; margin: 0 0 1rem; }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); }
  .card {
    display: flex; gap: .9rem; align-items: flex-start;
    padding: 1.25rem; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); min-height: 8.5rem;
    transition: border-color .15s, background-color .15s;
  }
  .card:hover { border-color: var(--brand); background: color-mix(in oklab, var(--brand-soft) 45%, var(--card)); }
  .card h3 { margin: 0 0 .4rem; font-size: 1rem; line-height: 1.4; }
  .card p { margin: 0; color: var(--muted-foreground); font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile { flex: none; width: 2.25rem; height: 2.25rem; border-radius: .6rem; display: grid; place-items: center; background: var(--muted); color: var(--muted-foreground); }
  .tile svg { width: 1.15rem; height: 1.15rem; }
  .tile img { width: 2.25rem; height: 2.25rem; }
  .tile.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .note { margin-top: 3rem; color: var(--muted-foreground); font-size: .85rem; }

  /* ── หน้าหัวข้อ ── */
  .doc { max-width: 96rem; margin: 0 auto; padding: 0 1.5rem; display: grid; grid-template-columns: 1fr; gap: 3rem; }
  @media (min-width: 64rem) { .doc { grid-template-columns: 19rem minmax(0, 1fr); } }
  .side { display: none; }
  @media (min-width: 64rem) {
    /* เมนูข้างเลื่อนแยกจากเนื้อหา แถบเลื่อนแสดงตลอดแบบคู่มือ SmartHub */
    .side { display: block; position: sticky; top: 4.5rem; align-self: start; max-height: calc(100vh - 4.5rem); overflow-y: scroll; padding: 2rem 1rem 2.5rem 0; scrollbar-width: thin; }
  }
  .side h2 { font-size: 1rem; margin: 2rem 0 .75rem; }
  .side h2:first-child { margin-top: 0; }
  .side .grp { border-left: 1px solid var(--border); }
  .side a { display: block; margin-left: -1px; padding: .5rem 0 .5rem 1.25rem; border-left: 2px solid transparent; color: var(--muted-foreground); font-size: .95rem; line-height: 1.5; }
  .side a:hover { color: var(--foreground); border-left-color: var(--muted-foreground); }
  .side a[aria-current="page"] { color: var(--brand); border-left-color: var(--brand); font-weight: 700; }
  .main { padding: 2.5rem 0 5rem; max-width: 68rem; }
  .back { display: inline-flex; align-items: center; gap: .35rem; font-size: .95rem; color: var(--muted-foreground); margin-bottom: 1rem; }
  .back:hover { color: var(--foreground); }
  @media (min-width: 64rem) { .back { display: none; } }
  .eyebrow { color: var(--brand); font-size: 1rem; font-weight: 700; }
  .main h1 { font-size: clamp(1.6rem, 1.1rem + 1.6vw, 2.25rem); line-height: 1.25; margin: .5rem 0 .75rem; }
  .lead { color: var(--muted-foreground); font-size: 1.1rem; margin: 0 0 3rem; }
  ol.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 3rem; }
  .step { display: grid; grid-template-columns: 3rem minmax(0, 1fr); gap: 1.25rem; }
  .num { width: 3rem; height: 3rem; border-radius: 999px; display: grid; place-items: center; font-weight: 700; font-size: 1.1rem; background: var(--brand-soft); color: var(--brand); }
  .step h3 { margin: .55rem 0 .35rem; font-size: 1.3rem; line-height: 1.4; }
  .step p { margin: 0; color: var(--muted-foreground); font-size: 1.05rem; }
  .step p + p { margin-top: .35rem; }
  .step .pts { margin: .35rem 0 0; padding: 0; list-style: none; display: grid; gap: .3rem; color: var(--muted-foreground); font-size: 1.05rem; }
  .step p + .pts { margin-top: .5rem; }
  .step .pts.dot { padding-left: 1.25rem; list-style: disc; }
  .ico { display: inline-block; height: 1.6em; width: auto; vertical-align: middle; margin: -.2em .1em 0; border-radius: 6px; box-shadow: 0 0 0 1px var(--border); }
  .step p a, .callout a { color: var(--brand); text-decoration: underline; text-underline-offset: 3px; }
  .shot { margin: 1.25rem 0 0; padding: .4rem; border: 1px solid var(--border); border-radius: 1rem; background: var(--card); box-shadow: var(--shadow); }
  .shot img { border-radius: .7rem; margin: 0 auto; }
  .shot figcaption { margin-top: .5rem; font-size: .85rem; color: var(--muted-foreground); text-align: center; }
  .kv { display: grid; gap: .35rem; margin-top: .35rem; }
  .kv div { display: grid; grid-template-columns: 4.5rem minmax(0,1fr); gap: .5rem; }
  .kv b { font-size: .95rem; }
  .kv span { color: var(--muted-foreground); font-size: 1.05rem; }
  .kv div > b:last-of-type { color: var(--foreground); }
  kbd, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; background: var(--muted); border: 1px solid var(--border); border-radius: .35rem; padding: .05rem .35rem; color: var(--foreground); }
  .only { display: inline-flex; align-items: center; gap: .3rem; margin-left: .5rem; padding: .1rem .55rem; border-radius: 999px; background: var(--muted); color: var(--foreground); font-size: .8rem; font-weight: 700; vertical-align: .15em; white-space: nowrap; }
  .only img { width: 1rem; height: 1rem; }
  .card .only { margin: 0 0 .4rem; }
  .lead-only { margin: -2.25rem 0 2.5rem; }
  .lead-only .only { margin-left: 0; }
  .cmp { margin-top: 3rem; }
  .cmp h2 { font-size: 1.3rem; margin: 0 0 1rem; }
  .tbl { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
  .tbl table { width: 100%; border-collapse: collapse; font-size: 1rem; }
  .tbl th, .tbl td { padding: .8rem 1rem; border-bottom: 1px solid var(--border); text-align: left; }
  .tbl tr:last-child > * { border-bottom: 0; }
  .tbl thead th { background: var(--muted); color: var(--muted-foreground); font-size: .9rem; white-space: nowrap; }
  .tbl thead img { display: inline-block; width: 1.1rem; height: 1.1rem; margin-right: .4rem; vertical-align: -.2em; }
  .tbl thead th + th { text-align: center; }
  .tbl tbody th { font-weight: 400; }
  .tbl tbody th small { display: block; color: var(--muted-foreground); font-size: .85rem; }
  .tbl td { width: 7.5rem; text-align: center; font-weight: 700; }
  .yes { color: var(--success); }
  .no { color: var(--muted-foreground); }
  .copy { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: 2.5rem 0 0; color: var(--muted-foreground); font-size: .95rem; }
  .copy code { font-family: inherit; font-weight: 700; font-size: .9rem; padding: .25rem .6rem; border-radius: .45rem; }
  .ext { display: inline-flex; align-items: center; gap: .4rem; min-height: 2.25rem; margin-top: 1.5rem; padding: 0 .9rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); font-size: .95rem; }
  .ext:hover { background: var(--muted); }
  .ext svg { width: 1rem; height: 1rem; }
  .callout { display: flex; width: fit-content; max-width: 100%; gap: .6rem; align-items: flex-start; margin: 2rem 0 0; padding: .8rem 1rem; border-radius: .6rem; border: 1px solid var(--tip-border); background: var(--tip-bg); color: var(--tip-fg); font-size: .95rem; }
  .copy + .callout { margin-top: 1.5rem; }
  .callout.warn { border-color: var(--warn-border); background: var(--warn-bg); color: var(--warn-fg); }
  .callout svg { flex: none; width: 1.1rem; height: 1.1rem; margin-top: .15rem; }
  .next { margin-top: 3.5rem; padding-top: 2.5rem; border-top: 1px solid var(--border); }
  .next h2 { font-size: 1.4rem; margin: 0 0 1rem; }
  .pair { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
  .link { display: flex; flex-direction: column; gap: .25rem; padding: 1rem 1.25rem; border: 1px solid var(--border); border-radius: .65rem; background: var(--card); transition: border-color .15s; }
  .link:hover { border-color: var(--brand); }
  .link b { display: flex; align-items: center; justify-content: space-between; gap: .5rem; font-size: 1rem; }
  .link span { color: var(--muted-foreground); font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .link small { color: var(--muted-foreground); font-size: .85rem; }
  .pn { margin-top: 2.5rem; padding-top: 2.5rem; border-top: 1px solid var(--border); }
  .pn .r { text-align: right; align-items: flex-end; }
  /* จอแคบ: ระยะขอบ 16px · ตัดบรรทัด System Manual · เลขขั้นเล็กลงให้ภาพกว้างพอ */
  @media (max-width: 40rem) {
    .top-in, .wrap, .doc { padding-left: 1rem; padding-right: 1rem; }
    .top-in { gap: .75rem; }
    .logo small { display: none; }
    .logo img { height: 1.6rem; }
    .crumb { padding-left: .75rem; }
    .step { grid-template-columns: 2.25rem minmax(0, 1fr); gap: .75rem; }
    .num { width: 2.25rem; height: 2.25rem; font-size: 1rem; }
    .step h3 { margin-top: .25rem; font-size: 1.15rem; }
    .step p, .step .pts { font-size: 1rem; }
    .shot { margin-left: -3rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#content">ข้ามไปที่เนื้อหา</a>
<header class="top">
  <div class="top-in">
    <a class="logo" href="#/" aria-label="SmartCHAT คู่มือการใช้งาน — หน้ารวมคู่มือ">
      <span><img class="lt" src="../brand/smartchat-light.png" width="480" height="120" alt="" /><img class="dk" src="../brand/smartchat-dark.png" width="480" height="120" alt="" /><small>System Manual</small></span>
    </a>
    <span class="crumb">คู่มือการใช้งาน</span>
    <span class="spacer"></span>
    <div class="theme" role="group" aria-label="ธีม">
      <button type="button" data-t="light" aria-label="โหมดสว่าง"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" data-t="dark" aria-label="โหมดมืด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
    </div>
  </div>
</header>
<main id="content" tabindex="-1"></main>

<script>
/* ---------- เนื้อหาคู่มือ ----------
   ภาพหน้าจอ: ตั้งค่า/ปัญหาที่พบบ่อย จากระบบ staging (22/10/2026) · Telegram จากแอป Telegram (ปิดโทเคนในภาพแล้ว)
   แต่ละหัวข้อ: id · title · desc (การ์ด/คำนำ) · icon · steps [{ t หัวข้อขั้น, d รายละเอียด (HTML), img + alt หรือ imgs [[src, alt]…] }] 
   · copy [ค่าที่ต้องคัดลอก] · tip / warn · ext [ชื่อปุ่ม, ลิงก์ภายนอก] · next [id] */
const TITLE = "เริ่มต้นใช้งาน SmartCHAT";
const SECTIONS = [
  { id: "start", title: TITLE, topics: [
    { id: "start", icon: "rocket", title: "เริ่มต้นใช้งานและรู้จักหน้าจอ",
      desc: "ดูว่าหน้าจอแต่ละส่วนและเมนูแต่ละจุดใช้ทำอะไร และเลือก Channel ที่จะดูแล",
      steps: [
        { t: "หน้าจอหลัก 3 ส่วน", d: "เปิด SmartCHAT แล้วจะเข้าหน้าหลักทันที โดยไม่ต้องเข้าสู่ระบบ <b>①</b> ด้านซ้ายคือรายการสนทนา แต่ละแถวคือ 1 เคส (การสนทนาหนึ่งรอบกับลูกค้า ตั้งแต่ลูกค้าส่งข้อความเข้ามาจนแอดมินปิดเคส) <b>②</b> ตรงกลางคือห้องแชท จะว่างอยู่จนกว่าจะเลือกแชท <b>③</b> แผงขวาแสดงข้อมูลสมาชิกและรายการเงิน เมื่อเปิดแชทหรือค้นหาลูกค้า", img: "img/app/first-home.webp", alt: "หน้าหลักของ SmartCHAT วง 1 รายการสนทนา 2 ห้องแชทที่ยังว่าง 3 แผงข้อมูลลูกค้า" },

  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></svg>',
  line: '<img src="../platform/line.svg" alt="" />',
  telegram: '<img src="../platform/telegram.svg" alt="" />',
  tip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4"/></svg>',
  arrowR: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
  arrowL: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
};
const only = (o) => o === "line" ? `<span class="only"><img src="../platform/line.svg" alt="" />เฉพาะ LINE</span>` : "";
const yes = (v) => v ? `<span class="yes">✓<span class="sr-only"> ใช้ได้</span></span>` : `<span class="no">—<span class="sr-only"> ใช้ไม่ได้</span></span>`;
const compareHtml = (rows) => `<div class="tbl"><table><thead><tr><th scope="col">ฟีเจอร์</th><th scope="col"><img src="../platform/line.svg" alt="" />LINE</th><th scope="col"><img src="../platform/telegram.svg" alt="" />Telegram</th></tr></thead>
  <tbody>${rows.map(([f, l, g, n]) => `<tr><th scope="row">${f}${n ? `<small>${n}</small>` : ""}</th><td>${yes(l)}</td><td>${yes(g)}</td></tr>`).join("")}</tbody></table></div>`;
const tile = (t) => `<span class="tile${t.icon === "warn" ? " warn" : ""}">${ICON[t.icon]}</span>`;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function indexPage() {
  return `<div class="wrap">
    <div class="hero"><h1>คู่มือการใช้งาน SmartCHAT</h1>
      <p>วิธีใช้ SmartCHAT สำหรับแอดมิน ตั้งแต่เข้าสู่ระบบ ตอบแชท ตรวจสลิป ปรับเครดิต จนถึงตั้งค่า Channel เลือกหัวข้อที่ต้องการได้จากรายการด้านล่าง</p></div>
    ${SECTIONS.map((s) => `<section class="sec" aria-labelledby="h-${s.id}">
      <h2 id="h-${s.id}">${s.title}</h2>
      <div class="grid">${s.topics.map((t) => `<a class="card" href="#/${t.id}">${tile(t)}<span><h3>${t.title}</h3>${only(t.only)}<p>${t.desc}</p></span></a>`).join("")}</div>
    </section>`).join("")}
    <p class="note">ภาพหน้าจอจากระบบต้นแบบที่ใช้ข้อมูลสมมติ เมื่อ 27/10/2026 ปุ่มและข้อความในระบบจริงอาจเปลี่ยนตามเวอร์ชัน</p>
  </div>`;
}

// เลขรุ่นของภาพหน้าจอ — เปลี่ยนทุกครั้งที่แคปใหม่ ให้เบราว์เซอร์โหลดภาพใหม่ ไม่ใช้ภาพเก่าที่จำไว้
const IMG_V = "20261029f";

// ①②③ ในคำอธิบาย ⇒ บรรทัดละข้อ (ข้อความก่อนข้อแรกเป็นย่อหน้านำ)
function para(d) {
  const parts = d.split(/(?=<b>[①-⑳]<\/b>)/).map((x) => x.trim()).filter(Boolean);
  const isItem = (x) => /^<b>[①-⑳]<\/b>/.test(x);
  if (!parts.some(isItem)) return `<p>${d}</p>`;
  return parts.filter((x) => !isItem(x)).map((x) => `<p>${x}</p>`).join("") + `<ul class="pts">${parts.filter(isItem).map((x) => `<li>${x}</li>`).join("")}</ul>`;
}

function stepHtml(s, i) {
  return `<li class="step"><span class="num" aria-hidden="true">${i + 1}</span><div>
    <h3><span class="sr-only">ขั้นที่ ${i + 1}: </span>${s.t}${only(s.only)}</h3>${s.cause ? `<div class="kv"><div><b>สาเหตุ</b><span>${s.cause}</span></div><div><b>วิธีแก้</b><span>${s.fix}</span></div></div>` : para(s.d)}${s.list ? `<ul class="pts dot">${s.list.map((x) => `<li>${x}</li>`).join("")}</ul>` : ""}
    ${(s.imgs || (s.img ? [[s.img, s.alt || ""]] : [])).map(([src, alt]) => `<figure class="shot"><img src="${src}?v=${IMG_V}" alt="${esc(alt)}" loading="lazy" /></figure>`).join("")}
  </div></li>`;
}

function topicPage(t) {
  const i = ALL.indexOf(t), prev = ALL[i - 1], next = ALL[i + 1];
  const cmp = t.compare ? `<section class="cmp" aria-labelledby="h-cmp"><h2 id="h-cmp">LINE กับ Telegram ต่างกันอย่างไร</h2>${compareHtml(t.compare)}</section>` : "";
  const body = cmp && !t.steps ? cmp : t.steps
    ? `<ol class="steps">${t.steps.map(stepHtml).join("")}</ol>` + cmp
    : `<figure class="shot" style="margin-top:0"><img src="${t.img}?v=${IMG_V}" alt="${esc(t.alt)}" /></figure>
       <ol class="steps" style="margin-top:2rem">
         <li class="step"><span class="num" aria-hidden="true">!</span><div><h3>สาเหตุ</h3><p>${t.cause}</p></div></li>
         <li class="step"><span class="num" aria-hidden="true">✓</span><div><h3>วิธีแก้</h3><p>${t.fix}</p></div></li>
       </ol>`;
  return `<div class="doc">
    <nav class="side" aria-label="หัวข้อคู่มือ">${SECTIONS.map((s) => `<h2>${s.title}</h2><div class="grp">${s.topics.map((x) => `<a href="#/${x.id}"${x.id === t.id ? ' aria-current="page"' : ""}>${x.title}</a>`).join("")}</div>`).join("")}</nav>
    <article class="main">
      <a class="back" href="#/">${ICON.arrowL}คู่มือทั้งหมด</a>
      <div class="eyebrow">${t.sec.title}</div>
      <h1 id="title" tabindex="-1">${t.title}</h1>
      <p class="lead">${t.desc}</p>${t.only ? `<p class="lead-only">${only(t.only)}</p>` : ""}
      ${body}
      ${t.copy ? `<p class="copy">ค่าที่ต้องคัดลอก ${t.copy.map((c) => `<code>${c}</code>`).join("")}</p>` : ""}
      ${t.tip ? `<div class="callout">${ICON.tip}<span>${t.tip}</span></div>` : ""}
      ${t.warn ? `<div class="callout warn" role="note">${ICON.warn}<span>${t.warn}</span></div>` : ""}
      ${t.ext ? `<a class="ext" href="${t.ext[1]}" target="_blank" rel="noopener">${t.ext[0]}${ICON.ext}<span class="sr-only"> (เปิดในแท็บใหม่)</span></a>` : ""}
      ${t.next && t.next.length ? `<section class="next" aria-labelledby="h-next"><h2 id="h-next">ขั้นต่อไป</h2><div class="pair">
        ${t.next.map(byId).filter(Boolean).map((n) => `<a class="link" href="#/${n.id}"><b>${n.title}${ICON.arrowR}</b><span>${n.desc}</span></a>`).join("")}
      </div></section>` : ""}
      <nav class="pair pn" aria-label="หัวข้อก่อนหน้าและถัดไป">
        ${prev ? `<a class="link" href="#/${prev.id}"><small>← ก่อนหน้า · ${prev.sec.title}</small><b>${prev.title}</b></a>` : "<span></span>"}
        ${next ? `<a class="link r" href="#/${next.id}"><small>ถัดไป · ${next.sec.title} →</small><b>${next.title}</b></a>` : ""}
      </nav>
    </article>
  </div>`;
}

const main = document.getElementById("content");
function render() {
  const id = location.hash.replace(/^#\/?/, "");
  const t = id && byId(id);
  main.innerHTML = t ? topicPage(t) : indexPage();
  // ภาพหน้าจอจากต้นแบบแคปที่ 2 เท่า ⇒ แสดงที่ครึ่งหนึ่งของความกว้างจริง (คมบนจอ retina · ขนาดเท่าจอจริง) แต่ไม่เกินความกว้างของเนื้อหา
  main.querySelectorAll('img[src*="img/app/"]').forEach((im) => {
    const fit = () => (im.style.width = im.naturalWidth / 2 + "px");
    im.complete && im.naturalWidth ? fit() : im.addEventListener("load", fit, { once: true });
  });
  document.title = t ? t.title + " · คู่มือการใช้งาน SmartCHAT" : "คู่มือการใช้งาน SmartCHAT";
  window.scrollTo(0, 0);
  if (t) document.getElementById("title")?.focus({ preventScroll: true });
}
addEventListener("hashchange", render);
render();

// ธีมสว่าง / มืด
const btns = document.querySelectorAll(".theme button");
function setTheme(v) {
  document.documentElement.dataset.theme = v;
  btns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.t === v)));
  try { localStorage.setItem("onechat-manual-theme", v); } catch {}
}
btns.forEach((b) => b.addEventListener("click", () => setTheme(b.dataset.t)));
setTheme(document.documentElement.dataset.theme);
</script>
</body>
</html>
