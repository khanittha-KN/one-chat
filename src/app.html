<!doctype html>
<html lang="th">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>OneChat Mockup</title>
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f9" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1e25" />
        <link rel="preload" href="/fonts/LINESeedSansTH_W_Rg.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="/fonts/LINESeedSansTH_W_Bd.woff2" as="font" type="font/woff2" crossorigin />
        <!-- ตั้งโหมดก่อนวาดหน้าแรก ไม่ให้กระพริบสว่างก่อนมืด (ค่าเดียวกับ theme.svelte.js) -->
        <script>
            try {
                const saved = localStorage.getItem(location.hostname + ":theme");
                document.documentElement.dataset.theme =
                    saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            } catch {}
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
